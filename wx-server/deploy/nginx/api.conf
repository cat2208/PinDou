# 拼豆手工店 API 域名 Nginx 配置
# 使用: sudo cp api.conf /etc/nginx/conf.d/ 后 sudo nginx -t && sudo systemctl reload nginx
# 必改: server_name 域名、证书路径（.pem / .key）、upstream 与项目实际路径保持一致

# ---- HTTP：强制跳转 HTTPS（证书校验路径除外）----
server {
    listen 80;
    server_name api.yourdomain.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # 阿里云数字证书管理服务下载的 Nginx 格式证书
    ssl_certificate     /etc/ssl/certs/api.yourdomain.com.pem;
    ssl_certificate_key /etc/ssl/private/api.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传图片允许较大的 body（图纸/晒图原图）
    client_max_body_size 20m;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
    }

    # ---- 上传文件静态资源（与后端 UPLOAD_DIR 对应）----
    location /uploads/ {
        alias /opt/wx-server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 健康检查 ----
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/api/config/public;
    }

    access_log /var/log/nginx/wx-api.access.log;
    error_log  /var/log/nginx/wx-api.error.log;
}