# 拼豆手工店 PC 运营管理后台 Nginx 配置（独立域名方案）
# 使用: sudo cp admin.conf /etc/nginx/conf.d/ 后 sudo nginx -t && sudo systemctl reload nginx
# 必改: server_name 域名、证书路径（.pem / .key）
#
# 说明：
# - PC 后台是后端内置托管（NestJS 静态托管 public/admin 与 public/images），
#   这里仅做反向代理，无需额外静态目录。
# - 若不想用独立域名，可跳过本文件，直接通过 API 域名访问：
#   https://api.yourdomain.com/admin/index.html
#   （前提：api.conf / deploy.sh 中已为 /admin、/images 配置 proxy_pass）

# ---- HTTP：强制跳转 HTTPS ----
server {
    listen 80;
    server_name admin.yourdomain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/admin.yourdomain.com.pem;
    ssl_certificate_key /etc/ssl/private/admin.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # PC 后台页面（原生单文件 index.html + 内部引用的 /images 站点图）
    location /admin/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点图片资源（banner 等），URL 形如 /images/home/banner1.png
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后台调用的 API 也经由此域名（与 api 域名等价）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/wx-admin.access.log;
    error_log  /var/log/nginx/wx-admin.error.log;
}